<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Excavation</title>
    <style>
        html,
        body,
        canvas {
            margin: 0px;
            padding: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
        }
    </style>
</head>

<body>
    <canvas id="glcanvas" tabindex='1'></canvas>
    <!-- Vendored macroquad/miniquad loader (no CDN). See build-web.sh. -->
    <script src="mq_js_bundle.js"></script>
    <!-- Web storage bridge (localStorage), must load before the wasm. -->
    <script src="excavation_storage.js"></script>
    <script>
        // Load the compiled wasm. `load` is defined by mq_js_bundle.js.
        load("excavation.wasm");
    </script>
</body>

</html>
